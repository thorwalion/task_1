ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.example.deepseek.ApplicationKt.module ]
    }
}

deepseek {
    # Base URL of the DeepSeek API (no trailing slash)
    baseUrl = "https://api.deepseek.com"
    baseUrl = ${?DEEPSEEK_BASE_URL}

    # Required. Never commit the real key to the repo.
    apiKey = ${?DEEPSEEK_API_KEY}

    model = "deepseek-flash"
    model = ${?DEEPSEEK_MODEL}

    reasoningEffort = "high"
    reasoningEffort = ${?DEEPSEEK_REASONING_EFFORT}

    thinkingType = "disabled"
    thinkingType = ${?DEEPSEEK_THINKING_TYPE}

    # Optional system prompt prepended to every request (not stored in the DB)
    systemPrompt = ${?DEEPSEEK_SYSTEM_PROMPT}

    timeoutSeconds = 120
    timeoutSeconds = ${?DEEPSEEK_TIMEOUT_SECONDS}
}

database {
    url = "jdbc:postgresql://localhost:5432/deepseek"
    url = ${?DATABASE_URL}
    user = "deepseek"
    user = ${?DATABASE_USER}
    password = "deepseek"
    password = ${?DATABASE_PASSWORD}
    maxPoolSize = 10
    maxPoolSize = ${?DATABASE_MAX_POOL_SIZE}
}
