services:
  postgres:
    image: postgres:17-alpine
    container_name: deepseek-postgres
    environment:
      POSTGRES_DB: deepseek
      POSTGRES_USER: deepseek
      POSTGRES_PASSWORD: deepseek
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepseek"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
